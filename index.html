<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portafolio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Isla Flotante de Navegación -->
  <nav class="floating-dock">
    <ul class="dock-list">
      
      <!-- 1. About Me (Icono de Notas de macOS) -->
      <li class="dock-item" data-tooltip="About Me">
        <a href="#about" class="dock-link">
          <img src="https://upload.wikimedia.org/wikipedia/commons/e/e4/Apple_Notes_Icon_%282020%29.png" alt="Notes" class="mac-icon">
        </a>
      </li>

      <!-- 2. Proyectos (Icono de Fotos de macOS) -->
      <li class="dock-item" data-tooltip="Projects">
        <a href="#projects" class="dock-link">
          <img src="https://upload.wikimedia.org/wikipedia/commons/f/fb/Apple_Photos_Icon_%282020%29.png" alt="Photos" class="mac-icon">
        </a>
      </li>

      <!-- 3. Servicios (Icono de Mensajes/Soporte estilo macOS) -->
      <li class="dock-item" data-tooltip="Services">
        <a href="#services" class="dock-link">
          <!-- Usamos el ícono de Mensajes de Mac, funciona bien para 'servicios/comunicación' -->
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/IMessage_logo.svg" alt="Services" class="mac-icon">
        </a>
      </li>

      <!-- 4. Contáctame (Icono de Mail de macOS) -->
      <li class="dock-item" data-tooltip="Contact Me">
        <a href="#contact" class="dock-link">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c5/Mac_Mail_icon.png" alt="Mail" class="mac-icon">
        </a>
      </li>

    </ul>
  </nav>

</body>
</html>
