<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portafolio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Isla Flotante de Navegación -->
  <nav class="floating-dock">
    <ul class="dock-list">
      
      <!-- 1. About Me (Tu icono de Notas) -->
      <li class="dock-item" data-tooltip="About Me">
        <a href="#about" class="dock-link">
          <img src="notas.webp" alt="Notes" class="mac-icon">
        </a>
      </li>

      <!-- 2. Proyectos (Tu icono de Fotos) -->
      <li class="dock-item" data-tooltip="Projects">
        <a href="#projects" class="dock-link">
          <img src="foto.png" alt="Photos" class="mac-icon">
        </a>
      </li>

      <!-- 3. Servicios (Tu icono de Finder) -->
      <li class="dock-item" data-tooltip="Services">
        <a href="#services" class="dock-link">
          <img src="finder icon.png" alt="Services" class="mac-icon">
        </a>
      </li>

      <!-- 4. Contáctame (Tu icono de Mail) -->
      <li class="dock-item" data-tooltip="Contact Me">
        <a href="#contact" class="dock-link">
          <img src="ICON MAIL.webp" alt="Mail" class="mac-icon">
        </a>
      </li>

    </ul>
  </nav>

</body>
</html>
